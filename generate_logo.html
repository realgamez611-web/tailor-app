<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Royal Fit Atelier Logo Generator</title>
  <style>
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      color: white;
    }
    #logo-container {
      width: 512px;
      height: 512px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border-radius: 96px;
      overflow: hidden;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: #D4AF37;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover { background: #f3cf55; }
  </style>
</head>
<body>

  <div id="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      <defs>
        <!-- Background Gradient -->
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a233a"/>
          <stop offset="100%" stop-color="#0a0d18"/>
        </radialGradient>
        
        <!-- Gold Metallic Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#BF953F"/>
          <stop offset="25%" stop-color="#FCF6BA"/>
          <stop offset="50%" stop-color="#B38728"/>
          <stop offset="75%" stop-color="#FBF5B7"/>
          <stop offset="100%" stop-color="#AA771C"/>
        </linearGradient>
      </defs>

      <!-- SOLID JPG BACKGROUND -->
      <rect width="512" height="512" fill="url(#bgGrad)"/>

      <!-- GOLD SHIELD / EMBLEM BORDER -->
      <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
      <rect x="32" y="32" width="448" height="448" rx="68" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6"/>

      <!-- CROWN -->
      <path d="M 216 130 L 236 160 L 256 120 L 276 160 L 296 130 L 316 180 L 196 180 Z" fill="url(#goldGrad)"/>
      <circle cx="216" cy="122" r="5" fill="url(#goldGrad)"/>
      <circle cx="256" cy="112" r="6" fill="url(#goldGrad)"/>
      <circle cx="296" cy="122" r="5" fill="url(#goldGrad)"/>

      <!-- MONOGRAM 'R' & MEASURING TAPE / SCISSORS ART -->
      <g transform="translate(0, 20)">
        <!-- Stylized Scissors -->
        <path d="M 210 280 C 190 300 170 300 160 280 C 150 260 170 240 190 250 L 256 210 L 322 250 C 342 240 362 260 352 280 C 342 300 322 300 302 280 L 256 230 Z" fill="url(#goldGrad)" opacity="0.85"/>
        
        <!-- Center Emblem / Thread Spool Shape -->
        <path d="M 256 190 L 290 270 L 222 270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
      </g>

      <!-- BRAND NAME TEXT -->
      <text x="256" y="380" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">ROYAL FIT</text>
      <text x="256" y="415" font-family="'Georgia', serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="6" opacity="0.9">ATELIER</text>
      
      <!-- ESTABLISHED TAG -->
      <line x1="160" y1="440" x2="210" y2="440" stroke="url(#goldGrad)" stroke-width="1"/>
      <text x="256" y="444" font-family="sans-serif" font-size="10" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">BESPOKE TAILORING</text>
      <line x1="302" y1="440" x2="352" y2="440" stroke="url(#goldGrad)" stroke-width="1"/>
    </svg>
  </div>

  <button class="btn" onclick="downloadJPG()">Download Logo as JPG</button>

  <script>
    function downloadJPG() {
      const svg = document.querySelector('svg');
      const xml = new XMLSerializer().serializeToString(svg);
      const svg64 = btoa(xml);
      const image64 = 'data:image/svg+xml;base64,' + svg64;

      const img = new Image();
      img.src = image64;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('canvas') || canvas.getContext('2d');
        
        // Fill canvas with dark background for JPG
        ctx.fillStyle = '#0a0d18';
        ctx.fillRect(0, 0, 512, 512);
        
        ctx.drawImage(img, 0, 0);

        const a = document.createElement('a');
        a.download = 'icon.jpg';
        a.href = canvas.toDataURL('image/jpeg', 0.95);
        a.click();
      };
    }
  </script>
</body>
</html>
